{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IARA-SAÚDE Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<!-- h-screen em telas médias+ para fixar altura; min-h-screen no celular para permitir rolagem -->
<body class="bg-white min-h-screen md:h-screen flex flex-col">

    <!-- NAVBAR (padding reduzido) -->
    <nav class="w-full bg-green-900 text-white px-4 py-2 md:py-3 flex items-center gap-2 shrink-0">
        <span class="font-bold text-base md:text-lg tracking-wide">
            IARA-SAÚDE
        </span>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 flex min-h-0">

        <!-- IMAGEM LATERAL -->
        <div class="hidden md:flex w-2/5 overflow-hidden">
            <img
                src="{% static 'images/logo_iara.png' %}"
                alt="IARA Saúde"
                class="w-full h-full object-cover"
            >
        </div>

        <!-- FORMULÁRIO (padding reduzido) -->
        <div class="w-full md:w-3/5 flex justify-center items-center bg-white p-4 md:p-6">

            <div class="w-full max-w-md">

                <h1 class="text-2xl md:text-3xl font-bold text-green-900 mb-1 md:mb-2">
                    Bem-vindo(a)
                </h1>

                <p class="text-sm text-gray-500 mb-4 md:mb-6">
                    Faça login para acessar o sistema.
                </p>

                {% if messages %}
                    {% for message in messages %}
                        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-3 text-sm">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3 md:mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            E-mail
                        </label>

                        <input
                            type="email"
                            name="email"
                            required
                            class="w-full px-4 py-2.5 md:py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-900 focus:border-transparent outline-none transition"
                        >
                    </div>

                    <div class="mb-4 md:mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Senha
                        </label>

                        <input
                            type="password"
                            name="password"
                            required
                            class="w-full px-4 py-2.5 md:py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-900 focus:border-transparent outline-none transition"
                        >
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-green-900 hover:bg-green-800 text-white font-semibold py-2.5 md:py-3 rounded-lg shadow-md transition active:scale-[0.98]"
                    >
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </main>

    <!-- FOOTER (padding reduzido) -->
    <footer class="bg-white border-t border-gray-200 py-2 md:py-3 shrink-0">

        <div class="container mx-auto px-4 flex flex-col md:flex-row items-center justify-center gap-3 md:gap-6">

            <!-- Logos Governo / CNPq -->
            <img
                src="{% static 'images/logo_CNPq.jpg' %}"
                alt="CNPq, Ministério da Ciência, Tecnologia e Inovação e Governo Federal"
                class="h-8 md:h-12 w-auto object-contain"
            >

            <!-- Logo FAPESP -->
            <img
                src="{% static 'images/logo_fapesp.png' %}"
                alt="FAPESP"
                class="h-6 md:h-10 w-auto object-contain"
            >

        </div>

    </footer>

</body>
</html>
