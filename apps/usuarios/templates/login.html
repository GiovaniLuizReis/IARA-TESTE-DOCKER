<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IARA-SAÚDE — Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-white h-screen overflow-hidden flex">

    <!-- ESQUERDA -->
    <div class="hidden md:flex w-2/5 flex-col justify-center items-center text-white p-12 bg-gradient-to-br from-slate-900 to-emerald-900 relative overflow-hidden">

        <div class="absolute inset-0 opacity-10">
            <span class="material-symbols-outlined absolute top-10 left-10 text-[100px]">public</span>
            <span class="material-symbols-outlined absolute bottom-20 right-20 text-[150px]">monitor_heart</span>
            <span class="material-symbols-outlined absolute top-1/2 left-3/4 text-[80px]">dataset</span>
        </div>

        <div class="relative z-10 text-center">
            <span class="material-symbols-outlined text-[80px] text-emerald-400 mb-6">
                health_and_safety
            </span>
            <h1 class="text-5xl font-bold mb-4 leading-tight">
                Dados que<br>salvam vidas
            </h1>
            <p class="text-xl font-light text-gray-200">
                Gestão epidemiológica em tempo real
            </p>
        </div>
    </div>

    <!-- DIREITA -->
    <div class="w-full md:w-3/5 flex justify-center items-center bg-white p-8">

        <div class="w-full max-w-[400px]">

            <div class="flex items-center gap-2 mb-10 text-blue-900">
                <span class="material-symbols-outlined text-[36px]">health_and_safety</span>
                <span class="text-3xl font-bold">IARA-SAÚDE</span>
            </div>

            <h2 class="text-2xl font-semibold mb-2 text-gray-900">Bem-vindo(a)</h2>
            <p class="text-sm text-gray-500 mb-8">Faça login para acessar o sistema.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}

                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        E-mail
                    </label>
                    <input
                        id="email"
                        type="email"
                        name="email"
                        value="{{ email|default:'' }}"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        Senha
                    </label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="flex items-center mb-6">
                    <input
                        id="manter_conectado"
                        type="checkbox"
                        name="manter_conectado"
                        class="h-4 w-4 text-emerald-500 border-gray-300 rounded focus:ring-emerald-400 cursor-pointer"
                    >
                    <label for="manter_conectado" class="ml-2 text-sm text-gray-600 cursor-pointer">
                        Manter conectado
                    </label>
                </div>

                <button
                    type="submit"
                    class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-semibold py-3 rounded-lg shadow-md transition"
                >
                    Entrar
                </button>

            </form>

        </div>
    </div>

</body>
</html>
