<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IARA-SAÚDE Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-white h-screen overflow-hidden flex flex-col">
    
    {% load static %}

    <!-- NAVBAR (sempre no topo) -->
    <nav class="w-full bg-green-900 text-white p-4 flex items-center gap-2 shrink-0 z-50">
        <span class="font-bold text-lg tracking-wide">IARA-SAÚDE</span>
    </nav>

    <!-- CONTEÚDO PRINCIPAL (rolável em mobile) -->
    <div class="flex-1 flex overflow-y-auto">
        
        <!-- ESQUERDA (imagem - só aparece em telas médias+) -->
        <div class="hidden md:flex w-2/5 relative overflow-hidden">
            <img src="{% static 'images/logo_iara.png' %}" alt="" class="w-full h-full object-cover" />
        </div>

        <!-- DIREITA (formulário - 100% no mobile, 60% em desktop) -->
        <div class="w-full md:w-3/5 flex justify-center items-center bg-white p-4 md:p-8">

            <div class="w-full max-w-[400px]">

                <div class="flex items-center gap-2 mb-8 md:mb-10 text-green-900">
                    <span class="text-2xl md:text-3xl font-bold">  Bem-vindo(a)</span>
                </div>

                <p class="text-sm text-gray-500 mb-8">
                    Faça login para acessar o sistema.
                </p>

                {% if messages %}
                    {% for message in messages %}
                        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                        <input type="email" name="email" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-900 focus:border-transparent outline-none transition" required>
                    </div>

                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                        <input type="password" name="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-900 focus:border-transparent outline-none transition" required>
                    </div>

                    <button type="submit" class="w-full bg-green-900 hover:bg-green-900 text-white font-semibold py-3 rounded-lg shadow-md transition active:scale-[0.98]">
                        Entrar
                    </button>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
