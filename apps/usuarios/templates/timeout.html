<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IARA-SAÚDE — Sessão Encerrada</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-10 max-w-md w-full text-center">

        <span class="material-symbols-outlined text-[64px] text-amber-400 mb-4 block">
            lock_clock
        </span>

        <h1 class="text-2xl font-bold text-gray-800 mb-2">Sessão encerrada</h1>

        <p class="text-gray-500 text-sm mb-8">
            Você foi desconectado por inatividade.<br>
            Faça login novamente para continuar.
        </p>

        <a href="{% url 'login' %}"
           class="inline-block bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition">
            Voltar ao login
        </a>

    </div>

</body>
</html>
