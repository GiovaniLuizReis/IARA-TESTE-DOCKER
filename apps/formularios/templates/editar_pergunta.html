{% extends 'base.html' %}

{% block title %}Editar Pergunta{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold mb-2">Modificar Campo de Pergunta</h1>
    <p class="text-gray-500 mb-8">Ajuste os parâmetros estruturais do campo.</p>

    <form method="POST" class="bg-white rounded-2xl shadow-sm border p-8 space-y-6">
        {% csrf_token %}
        <div>
            <label class="block mb-2 font-medium text-gray-700">Título / Pergunta</label>
            {{ form.titulo }}
        </div>
        <div>
            <label class="block mb-2 font-medium text-gray-700">Subtítulo (Opcional)</label>
            {{ form.subtitulo }}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block mb-2 font-medium text-gray-700">Tipo de Resposta</label>
                {{ form.tipo }}
            </div>
            <div>
                <label class="block mb-2 font-medium text-gray-700">Ordem</label>
                {{ form.ordem }}
            </div>
            <div class="flex items-center pt-8">
                <label class="flex items-center gap-3 cursor-pointer">
                    {{ form.obrigatoria }}
                    <span class="font-medium text-gray-700">Obrigatória</span>
                </label>
            </div>
        </div>
        <div class="mt-8 flex gap-3 pt-4 border-t">
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-medium shadow-sm">
                Salvar Alterações
            </button>
            <a href="{% url 'gerenciar_estrutura' pergunta.bloco.formulario.id %}" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-6 py-3 rounded-xl font-medium">
                Cancelar
            </a>
        </div>
    </form>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll('input[type="text"], input[type="number"], textarea, select').forEach(f => f.classList.add('w-full', 'rounded-xl', 'border-gray-300', 'shadow-sm', 'focus:border-emerald-500', 'focus:ring-emerald-500'));
        document.querySelector('input[type="checkbox"]').classList.add('rounded', 'border-gray-300', 'text-emerald-600', 'h-5', 'w-5');
    });
</script>
{% endblock %}
