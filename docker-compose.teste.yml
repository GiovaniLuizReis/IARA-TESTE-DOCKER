services:
  db_teste:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iara_teste_db
      POSTGRES_USER: iara_teste_user
      POSTGRES_PASSWORD: senha_teste_123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iara_teste_user -d iara_teste_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db_teste:
        condition: service_healthy